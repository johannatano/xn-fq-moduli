[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xnfq"
version = "0.1.0"
description = "Finite-field point counts and Frobenius traces for modular curves with level structure"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Johanna Tano" },
]
keywords = ["modular curves", "finite fields"]
dependencies = []

[project.optional-dependencies]
examples = [
    "matplotlib>=3.8",
    "requests>=2.31",
    "sympy>=1.12",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["xnfq*"]

[project.scripts]
xnfq-get-classnb-db = "xnfq.cli:main"
